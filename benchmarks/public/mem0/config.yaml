version: "v1.1"

llm:
  provider: openai
  config:
    model: claude-sonnet-5
    temperature: 0.1
    api_key: not-used
    openai_base_url: http://127.0.0.1:8790/v1

embedder:
  provider: ollama
  config:
    model: nomic-embed-text
    ollama_base_url: http://127.0.0.1:11434
    embedding_dims: 768

history_db_path: ${MEM0_HISTORY_DB}
