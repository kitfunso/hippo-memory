<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="t d">
  <title id="t">hippo init adding memory to one project</title>
  <desc id="d">Animated terminal. hippo init, run inside one project, creates the project's .hippo store, adds a block to the project's CLAUDE.md, installs 7 Claude Code hooks in the user settings, schedules a daily 6:15am run and starts seeding memories from the last 30 days of git history. The lines are the ones hippo init prints; the path is an example.</desc>

  <defs>
    <style>
      .frame  { fill: #1a1a1f; }
      .titlebar { fill: #2b2b33; }
      .dot-r  { fill: #ff5f56; }
      .dot-y  { fill: #ffbd2e; }
      .dot-g  { fill: #27c93f; }
      .title-text { fill: #888; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; }

      .term   { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; }
      .prompt { fill: #27c93f; }
      .cmd    { fill: #e5e5e5; }
      .info   { fill: #a8a8a8; }
      .accent { fill: #ffbd2e; }

      /* One shared 9s cycle, so every line fades out together before the next loop. */
      .line { opacity: 0; animation: s0 9s linear infinite; }
      .l1 { animation-name: s0; }
      .l2 { animation-name: s1; }
      .l3 { animation-name: s2; }
      .l4 { animation-name: s3; }
      .l5 { animation-name: s4; }
      .l6 { animation-name: s5; }
      @keyframes s0 { 0% { opacity: 0; } 2%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s1 { 0%, 11% { opacity: 0; } 13%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s2 { 0%, 22% { opacity: 0; } 24%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s3 { 0%, 33% { opacity: 0; } 35%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s4 { 0%, 44% { opacity: 0; } 46%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s5 { 0%, 55% { opacity: 0; } 57%, 94% { opacity: 1; } 100% { opacity: 0; } }

      .cursor { fill: #e5e5e5; animation: blink 1s steps(2, end) infinite; }
      @keyframes blink {
        0%, 50%  { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      /* Reduced motion (WCAG 2.3.3): show the final frame instead of looping. */
      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect class="frame"    x="0"  y="0"  width="800" height="390" rx="10" />
  <rect class="titlebar" x="0"  y="0"  width="800" height="28"  rx="10" />
  <rect class="titlebar" x="0"  y="18" width="800" height="10"  />
  <circle class="dot-r" cx="18" cy="14" r="6"/>
  <circle class="dot-y" cx="38" cy="14" r="6"/>
  <circle class="dot-g" cx="58" cy="14" r="6"/>
  <text class="title-text" x="400" y="18" text-anchor="middle">~/billing-service</text>

  <!-- The output is cmdInit's own text in src/cli.ts; the lesson count that follows seeding depends on the repo, so it is left out. -->
  <g class="term">
    <text class="line l1" x="20" y="60"><tspan class="prompt">$</tspan> <tspan class="cmd">hippo init</tspan></text>

    <text class="line l2 cmd" x="20" y="88">Initialized Hippo at /home/you/billing-service/.hippo</text>
    <text class="line l2 info" x="44" y="108">Directories: buffer/ episodic/ semantic/ conflicts/</text>
    <text class="line l2 info" x="44" y="128">Files: hippo.db stats.json</text>

    <text class="line l3 info" x="44" y="148">Auto-installed claude-code hook in <tspan class="accent">CLAUDE.md</tspan></text>

    <text class="line l4 info" x="44" y="168">Auto-installed hippo session-end <tspan class="accent">SessionEnd</tspan> hook in claude-code settings</text>
    <text class="line l4 info" x="44" y="188">Auto-installed hippo last-sleep <tspan class="accent">SessionStart</tspan> hook in claude-code settings</text>
    <text class="line l4 info" x="44" y="208">Auto-installed hippo pinned-inject <tspan class="accent">UserPromptSubmit</tspan> hook in claude-code settings</text>
    <text class="line l4 info" x="44" y="228">Auto-installed hippo pre-compact <tspan class="accent">PreCompact</tspan> hook in claude-code settings</text>
    <text class="line l4 info" x="44" y="248">Auto-installed hippo compact-resume <tspan class="accent">SessionStart(compact)</tspan> hook in claude-code settings</text>
    <text class="line l4 info" x="44" y="268">Auto-installed hippo post-compact <tspan class="accent">PostCompact</tspan> hook in claude-code settings</text>
    <text class="line l4 info" x="44" y="288">Auto-installed hippo capture-error <tspan class="accent">PostToolUseFailure</tspan> hook in claude-code settings</text>

    <text class="line l5 info" x="44" y="308">Scheduled machine-level daily runner <tspan class="accent">(6:15am)</tspan> via crontab</text>

    <text class="line l6 info" x="44" y="344">Seeding memories from last <tspan class="accent">30 days</tspan> of git history...</text>
  </g>

  <rect class="cursor" x="20" y="358" width="8" height="15"/>
</svg>
