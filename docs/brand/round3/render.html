<!doctype html>
<meta charset="utf-8">
<title>hippo round 3 render</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const CONCEPT = q.get('c') || 'A';
const SIZE = Number(q.get('s') || 1024);
const FLOOR = q.get('floor') !== '0';
const BG = q.get('bg') !== '0';
const YAW = Number(q.get('yaw') || 0);

const INK = '#0b0f0c', MINT = '#7ce38b', AMBER = '#f2b84b';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
if (BG) scene.background = new THREE.Color(INK);

// Studio: soft white boxes plus a mint rim and an amber kicker, baked into the reflections.
function studio() {
  const s = new THREE.Scene();
  s.background = new THREE.Color('#020302');
  const panel = (w, h, color, k, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(7, 2.2, '#ffffff', 4, [0, 7, 2]);
  panel(0.9, 7, '#ffffff', 3.5, [-6.5, 1, 2.5]);
  panel(0.6, 7, '#ffffff', 1.6, [6.5, 1, 3]);
  panel(1.4, 6, MINT, 2.2, [5.5, 0.5, -3]);
  panel(5, 0.6, AMBER, 0.9, [2.5, -4, 3.5]);
  const pmrem = new THREE.PMREMGenerator(renderer);
  return pmrem.fromScene(s, 0.01).texture;
}
scene.environment = studio();

const key = new THREE.DirectionalLight('#ffffff', 0.6);
key.position.set(1.2, 7, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 16;
key.shadow.blurSamples = 24;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 20 });
scene.add(key);

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);

// Dark polished body; per-vertex "glow" attribute is the memory's strength, shaded brighter face-on.
function memoryMat(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({
    color: '#0a100c', metalness: 0.1, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.04,
    emissive: '#ffffff', emissiveIntensity: 1, envMapIntensity: 1.3, iridescence: 0.15, ...o,
  });
  m.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec3 glow;\nvarying vec3 vGlow;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGlow = glow;');
    s.fragmentShader = s.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vGlow;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float facing = max(dot(normal, normalize(vViewPosition)), 0.0);
        totalEmissiveRadiance *= vGlow * (0.25 + 0.75 * pow(facing, 1.4));`);
  };
  return m;
}

function paint(geo, fn) {
  const p = geo.attributes.position, uv = geo.attributes.uv, out = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    fn(c, p.getX(i), p.getY(i), p.getZ(i), uv ? uv.getX(i) : 0);
    out.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('glow', new THREE.BufferAttribute(out, 3));
  return geo;
}
const solid = (hex, k) => (c) => c.set(hex).multiplyScalar(k);

// Piecewise-linear ramp over [t, hex, intensity] stops, in linear colour space.
function ramp(stops) {
  const cols = stops.map(([t, hex, k]) => [t, new THREE.Color(hex).multiplyScalar(k)]);
  return (c, t) => {
    t = Math.min(1, Math.max(0, t));
    let i = 0; while (i < cols.length - 2 && t > cols[i + 1][0]) i++;
    const [t0, a] = cols[i], [t1, b] = cols[i + 1];
    c.copy(a).lerp(b, (t - t0) / (t1 - t0 || 1));
  };
}

// Tube whose radius varies along the curve; uv.x runs 0..1 by arc length.
function taperedTube(curve, segs, radial, radiusAt) {
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], nor = [], uv = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, P = curve.getPointAt(t), N = frames.normals[i], B = frames.binormals[i], r = radiusAt(t);
    for (let j = 0; j <= radial; j++) {
      const v = (j / radial) * Math.PI * 2, s = Math.sin(v), c = -Math.cos(v);
      const n = new THREE.Vector3(c * N.x + s * B.x, c * N.y + s * B.y, c * N.z + s * B.z);
      nor.push(n.x, n.y, n.z); pos.push(P.x + r * n.x, P.y + r * n.y, P.z + r * n.z); uv.push(t, j / radial);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = (i + 1) * (radial + 1) + j;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function pearl(r, hex, k, at) {
  const m = new THREE.Mesh(paint(new THREE.SphereGeometry(r, 96, 64), solid(hex, k)), memoryMat());
  if (at) m.position.copy(at);
  return m;
}

const root = new THREE.Group();
scene.add(root);
let lowest = -1.2;

// A: the recall spiral. A seahorse-tail curl (hippocampus) that is bright where recalled and
// cools to dark stone as it winds in; the eye is the one memory marked wrong.
function conceptA() {
  const turns = 2.05, R0 = 1.08, Rend = 0.2;
  const k = Math.log(R0 / Rend) / (turns * 2 * Math.PI);
  const spiralR = (t) => R0 * Math.exp(-k * t * turns * 2 * Math.PI);
  const curve = new (class extends THREE.Curve {
    getPoint(t, out = new THREE.Vector3()) {
      const th = -(t * turns * 2 * Math.PI) + 2.4, r = spiralR(t);
      return out.set(r * Math.cos(th), r * Math.sin(th), 0.42 * t);
    }
  })();
  const thick = (t) => 0.2 * Math.pow(spiralR(t) / R0, 0.7) * (t > 0.93 ? Math.sqrt(1 - (t - 0.93) / 0.0701) : 1);
  const fade = ramp([[0, '#b4f7bf', 2.0], [0.15, MINT, 1.6], [0.45, '#3d9c50', 0.55], [0.75, '#1a4a26', 0.1], [1, '#000000', 0]]);
  root.add(new THREE.Mesh(paint(taperedTube(curve, 1400, 96, thick), (c, x, y, z, u) => fade(c, u)), memoryMat()));
  root.add(pearl(thick(0), '#b4f7bf', 2.0, curve.getPointAt(0)));
  root.add(pearl(0.105, AMBER, 1.5, new THREE.Vector3(0.02, 0.0, 0.5)));
  root.rotation.set(-0.22, -0.3 + YAW, 0);
  root.position.y = 0.04;
  lowest = -1.2;
}

// B: the memory string. The site's spiral as pearls, bright to faint, one amber.
function conceptB() {
  const n = 22;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), a = -t * 1.7 * 2 * Math.PI + 2.4, r = 0.62 * Math.exp(-1.5 * t);
    const wrong = i === 13;
    const kk = wrong ? 1.5 : 2.2 * Math.pow(1 - t, 1.8) + 0.02;
    root.add(pearl(0.095 * (1 - 0.5 * t), wrong ? AMBER : MINT, kk, new THREE.Vector3(r * Math.cos(a), r * Math.sin(a), 0.3 * t)));
  }
  root.scale.setScalar(1.45);
  root.rotation.set(-0.2, -0.3 + YAW, 0);
  lowest = -1.0;
}

// C: the h. A monoline lowercase h that is lit at the top and fades toward its feet.
function conceptC() {
  const x = 0.42, foot = -0.95, top = 1.0, spring = 0.2, R = 0.2;
  const shape = new THREE.CurvePath();
  shape.add(new THREE.LineCurve3(new THREE.Vector3(-x, top, 0), new THREE.Vector3(-x, foot, 0)));
  const arch = new THREE.CurvePath();
  arch.add(new THREE.LineCurve3(new THREE.Vector3(-x, spring - 0.25, 0), new THREE.Vector3(-x, spring, 0)));
  arch.add(new THREE.CubicBezierCurve3(new THREE.Vector3(-x, spring, 0), new THREE.Vector3(-x, 0.78, 0),
    new THREE.Vector3(x, 0.78, 0), new THREE.Vector3(x, spring, 0)));
  arch.add(new THREE.LineCurve3(new THREE.Vector3(x, spring, 0), new THREE.Vector3(x, foot, 0)));
  const lo = new THREE.Color('#2f8a44'), hi = new THREE.Color('#b4f7bf');
  const glowY = (c, px, py) => {
    const t = Math.min(1, Math.max(0, (py - foot) / (top - foot)));
    c.copy(lo).lerp(hi, t * t).multiplyScalar(2.0 * Math.pow(t, 2.4));
  };
  const mat = memoryMat();
  for (const curve of [shape, arch]) root.add(new THREE.Mesh(paint(new THREE.TubeGeometry(curve, 500, R, 96, false), glowY), mat));
  for (const [px, py] of [[-x, top], [-x, foot], [x, foot]]) {
    const cap = new THREE.Mesh(paint(new THREE.SphereGeometry(R, 96, 64), (c, a, b) => glowY(c, 0, b + py)), mat);
    cap.position.set(px, py, 0); root.add(cap);
  }
  root.rotation.set(-0.08, -0.42 + YAW, 0);
  lowest = -1.18;
}

// D: half-life gyroscope. Three rings, each an older generation of memory, dimmer inward; amber rider.
function conceptD() {
  const rings = [[1.0, 1.9, [1.3, 0, 0.12]], [0.74, 0.55, [0.25, 1.05, 0]], [0.5, 0.12, [-0.7, 0.2, 0.9]]];
  rings.forEach(([R, kk, rot], i) => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(paint(new THREE.TorusGeometry(R, 0.075 - i * 0.012, 64, 400), solid(MINT, kk)), memoryMat()));
    if (i === 1) g.add(pearl(0.085, AMBER, 1.5, new THREE.Vector3(R * Math.cos(0.9), R * Math.sin(0.9), 0)));
    g.rotation.set(...rot); root.add(g);
  });
  root.add(pearl(0.14, '#d6ffdc', 2.2));
  root.rotation.y = YAW;
  lowest = -1.05;
}

({ A: conceptA, B: conceptB, C: conceptC, D: conceptD })[CONCEPT]();
root.traverse((o) => { if (o.isMesh) o.castShadow = true; });

if (FLOOR) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.5, color: '#000000' }));
  root.updateMatrixWorld(true);
  lowest = new THREE.Box3().setFromObject(root).min.y;
  floor.rotation.x = -Math.PI / 2; floor.position.y = lowest - 0.06; floor.receiveShadow = true; scene.add(floor);
}

camera.position.set(0, 0.45, 7.4);
camera.lookAt(0, -0.05, 0);

let frames = 0;
function tick() {
  renderer.render(scene, camera);
  if (++frames < 6) requestAnimationFrame(tick); else window.__done = true;
}
tick();
</script>
