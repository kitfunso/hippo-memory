<!doctype html>
<html lang="en"><meta charset="utf-8"><title>hippo round 6 surfacing</title>
<style>html,body{margin:0;background:#0b0f0c}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<body>
<script type="module">
import * as THREE from 'three';
import { createScene, paramsFrom } from './scene.js';

const q = paramsFrom(location.search);
const SIZE = +(q.size || 1024);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, alpha: !!+(q.alpha || 0) });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.transmissionResolutionScale = 1;
document.body.appendChild(renderer.domElement);
const dbg = renderer.getContext().getExtension('WEBGL_debug_renderer_info');
if (dbg) console.log('gpu:', renderer.getContext().getParameter(dbg.UNMASKED_RENDERER_WEBGL));

try {
  const t0 = performance.now();
  const { render } = createScene(renderer, SIZE, q);
  console.log('built in', Math.round(performance.now() - t0), 'ms');
  let frames = 0;
  const tick = () => { render(); if (++frames < 3) requestAnimationFrame(tick); else window.__done = true; };
  tick();
} catch (e) {
  console.error('scene failed:', e.stack || e);
  window.__done = true;
}
</script>
</body></html>
