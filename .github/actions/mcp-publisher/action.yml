# The one place the mcp-publisher version and its sha256 live: ci.yml validates server.json with it, mcp-registry.yml publishes.
name: mcp-publisher
description: Download the pinned mcp-publisher for Linux x64, check its sha256 and leave ./mcp-publisher in the workspace.
runs:
  using: composite
  steps:
    - name: Download mcp-publisher
      shell: bash
      env:
        MCP_PUBLISHER_VERSION: v1.8.10
        MCP_PUBLISHER_SHA256: 32d287ed6fb7dc04eddd2621097784c06a355b2348b35ccc630a1643aa75ff4a
      run: |
        curl -fsSL -o mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
        echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
        tar -xzf mcp-publisher.tar.gz mcp-publisher
