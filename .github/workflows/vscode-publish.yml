# Lists the VS Code extension (extensions/vscode) on Open VSX and the VS Code Marketplace.
# npm-publish.yml calls this after a `latest` publish; run it by hand to list a version already on npm.
# One-time setup: repo secrets OVSX_PAT (open-vsx.org token) and VSCE_PAT (Azure DevOps, Marketplace Manage).
name: Publish the VS Code extension

on:
  workflow_call:
    secrets:
      OVSX_PAT:
        required: false
      VSCE_PAT:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both CLIs read their token from these variables, so no token goes on a command line.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The extension has no dependencies; without the flag vsce runs npm list on the repo root and fails.
      - run: npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out hippo-memory.vsix
      - name: Publish to Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT is not set, so Open VSX was skipped"; exit 0; fi
          npx --yes ovsx@1.4.0 publish hippo-memory.vsix --skip-duplicate
      - name: Publish to the VS Code Marketplace
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::VSCE_PAT is not set, so the VS Code Marketplace was skipped"; exit 0; fi
          npx --yes @vscode/vsce@4.1.1 publish --packagePath hippo-memory.vsix --skip-duplicate
