# Setup: repo secret OVSX_PAT (open-vsx.org token). The Marketplace needs no secret: the kitfunso
# publisher has Trusted Publishing policies for this file and npm-publish.yml, so vsce signs in with OIDC.
name: Publish the VS Code extension

on:
  workflow_call:
    secrets:
      OVSX_PAT:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # ovsx reads its token from this variable, so no token goes on a command line.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      # The extension has no dependencies; without the flag vsce runs npm list on the repo root and fails.
      - id: package
        run: npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out hippo-memory.vsix
      - name: Publish to Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT is not set, so Open VSX was skipped"; exit 0; fi
          npx --yes ovsx@1.4.0 publish hippo-memory.vsix --skip-duplicate
      # Azure DevOps retires global PATs on 1 Dec 2026, so the Marketplace uses Trusted Publishing.
      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npx --yes @vscode/vsce@4.1.1 publish --packagePath hippo-memory.vsix --skip-duplicate --oidc
