name: concurrency-queue-probe
# Throwaway: proves GitHub accepts `concurrency.queue: max` before npm-publish.yml relies on it. Removed before merge.
on:
  push:
    branches: [fix/support-bundle-final-review]

permissions:
  contents: read

concurrency:
  group: concurrency-queue-probe
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "concurrency queue max accepted"
