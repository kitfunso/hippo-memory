name: Publish to npm

# Publishes hippo-memory from CI with npm provenance: a signed record of the
# commit and workflow that built the package, shown on npmjs.com and checked
# by `npm audit signatures`. Trigger: push a v*.*.* tag, cut from master for a
# release or from release/<x.y> for a backport (docs/release-policy.md).
# The whole CI workflow and the slow token-eval tests run on the tagged commit first; nothing is published unless both pass.
# Python has its own tag scheme (python-v*.*.*) in pypi-publish.yml.
#
# One-time setup (npmjs.com, package settings > Trusted publishing): add a
# GitHub Actions publisher for kitfunso/hippo-memory with workflow file
# npm-publish.yml and "Allow npm publish" ticked; unticked, it may only stage.
# No NPM_TOKEN secret is needed after that.
# docs/release-policy.md covers tags and the `stable` channel.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# One publish at a time: the dist-tag is picked before the long release gate, so two tags
# pushed together would both read the old `latest`. `max` queues extra runs instead of cancelling them.
concurrency:
  group: npm-publish
  queue: max

jobs:
  # Called here, not looked up by commit: a backport commit has no CI run of its own, and a tag can be pushed before one finishes.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The harness tests the default run leaves out, so no test file sits outside the release.
  token-eval:
    uses: ./.github/workflows/token-eval.yml
    permissions:
      contents: read

  publish:
    needs: [ci, token-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-expiring-keys-floor.mjs reads earlier release tags; a shallow clone holds only this one.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi
      - name: Pick the publish dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$(node scripts/publish-dist-tag.mjs "$version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # prepublishOnly runs the full release gate: manifest versions, changelog,
      # build:all, the openclaw smoke install and the test suite.
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
