name: Publish to npm

# One-time setup (npmjs.com, package settings > Trusted publishing): add a
# GitHub Actions publisher for kitfunso/hippo-memory with workflow file
# npm-publish.yml and "Allow npm publish" ticked; unticked, it may only stage.
# No NPM_TOKEN secret is needed after that.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  queue: max

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  token-eval:
    uses: ./.github/workflows/token-eval.yml
    permissions:
      contents: read

  publish:
    needs: [ci, token-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      dist-tag: ${{ steps.disttag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # check-expiring-keys-floor.mjs reads earlier release tags; a shallow clone holds only this one.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; an exact pin keeps a new npm release from changing the publish job.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi
      - name: Pick the publish dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="$(node scripts/publish-dist-tag.mjs "$version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}

  mcp-registry:
    needs: [publish]
    uses: ./.github/workflows/mcp-registry.yml
    permissions:
      contents: read
      id-token: write

  vscode:
    needs: [publish]
    if: needs.publish.outputs.dist-tag == 'latest'
    uses: ./.github/workflows/vscode-publish.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
