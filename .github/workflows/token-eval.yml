# The token-eval harness tests, kept out of ci.yml's per-PR suite because they take a quarter of its Windows time.
# Every push to master runs them, so a src change that breaks the harness shows before a release tag.
name: Token eval

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'scripts/token-eval/**'
      - 'tests/token-eval*'
      - 'tests/fixtures/fake-claude.mjs'
      - 'tests/fixtures/z0-checks/**'
      - 'tests/fixtures/z0-contract.ts'
      - 'tests/fixtures/z0-gen.ts'
      - 'vitest.eval.config.ts'
      - '.github/workflows/token-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-eval:
    name: token-eval (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The temp dirs ci.yml gives these tests: tmpfs on Linux, and D: on Windows, where C: takes 5 ms per fsync.
      - name: Temp dir on tmpfs
        if: runner.os == 'Linux'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"
      - name: Temp dir on the D drive
        if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Vitest
        # Bash on Windows too, so the `--` reaches npm; four workers there, as in ci.yml's suite job.
        shell: bash
        run: npm run test:eval -- ${{ runner.os == 'Windows' && '--maxWorkers=4' || '' }}
