name: Token eval

on:
  push:
    branches: [master, next/2.0, next/3.0]
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/token-eval/**'
      - 'tests/eval/token-eval*'
      - 'tests/fixtures/fake-claude.mjs'
      - 'tests/fixtures/fake-codex.mjs'
      - 'tests/fixtures/z0-checks/**'
      - 'tests/fixtures/z0-codex-harness.ts'
      - 'tests/fixtures/z0-contract.ts'
      - 'tests/fixtures/z0-gen.ts'
      - 'tests/fixtures/z0-harness.ts'
      - 'tests/fixtures/z0-turns-harness.ts'
      - 'vitest.config.ts'
      - 'vitest.eval.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/_helpers/**'
      - 'tests/_*.ts'
      - 'tests/_*.mjs'
      - '.github/workflows/token-eval.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: token-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  token-eval:
    name: token-eval (${{ matrix.os }}, ${{ matrix.part.name }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        part:
          - { name: harness 1/3, args: --project harness --shard=1/3 }
          - { name: harness 2/3, args: --project harness --shard=2/3 }
          - { name: harness 3/3, args: --project harness --shard=3/3 }
          - { name: codex 1/4, args: --project codex --shard=1/4 }
          - { name: codex 2/4, args: --project codex --shard=2/4 }
          - { name: codex 3/4, args: --project codex --shard=3/4 }
          - { name: codex 4/4, args: --project codex --shard=4/4 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Temp dir on tmpfs
        if: runner.os == 'Linux'
        run: echo "TMPDIR=/dev/shm" >> "$GITHUB_ENV"
      - name: Temp dir on the D drive
        if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Vitest
        # Bash on Windows too, so the `--` reaches npm.
        shell: bash
        run: npm run test:eval -- ${{ matrix.part.args }}
