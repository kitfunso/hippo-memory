name: Publish Python SDK to PyPI

# Trigger: tag push matching python-v*.*.* (e.g., python-v0.1.0).
# Distinct from v*.*.* which is the npm release tag scheme — keeps the two
# publish surfaces independent.
on:
  push:
    tags:
      - 'python-v*.*.*'

permissions:
  contents: read    # required for actions/checkout (top-level permissions defaults unlisted to none)
  id-token: write   # required for PyPI trusted publisher OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hippo-memory-sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.9"  # uv_build backend requires >= 0.5.0

      - name: Build wheel + sdist
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist/
