name: Publish Python SDK to PyPI

# Trigger: tag push matching python-v*.*.* (e.g., python-v0.1.0).
# Distinct from v*.*.* which is the npm release tag scheme — keeps the two
# publish surfaces independent.
on:
  push:
    tags:
      - 'python-v*.*.*'

permissions:
  contents: read    # required for actions/checkout (top-level permissions defaults unlisted to none)
  id-token: write   # required for PyPI trusted publisher OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hippo-memory-sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"  # uv_build backend requires >= 0.5.0

      - name: Build wheel + sdist
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
