name: Security scan

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      log_opts:
        description: 'git log range for gitleaks; --all sweeps every branch'
        required: true
        default: '--all'
        type: string

permissions: {}

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}

jobs:
  codeql:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:javascript-typescript

  npm-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Dependency security audit
        run: npm run audit:security

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --log-opts="${BASE_SHA}..${HEAD_SHA}"'
      # A bare `gitleaks git` reads every branch, so a fixture on any side branch would fail master.
      - name: Scan master's history
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --log-opts="HEAD"'
      - name: Scan the commits this branch adds to master
        if: github.event_name == 'push' && github.ref != 'refs/heads/master'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --log-opts="origin/master..HEAD"'
      - name: Scan the range asked for
        if: github.event_name == 'workflow_dispatch'
        env:
          LOG_OPTS: ${{ inputs.log_opts }}
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v --log-opts="$LOG_OPTS"'
